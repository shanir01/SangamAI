<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a free API key · SangamAI</title>
<style>
  body{margin:0;background:#0b0f17;color:#e6edf7;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .box{max-width:460px;margin:9vh auto;padding:22px;background:#131a26;border:1px solid #223047;border-radius:16px}
  h1{font-size:21px;margin:0 0 6px}.mut{color:#8ea0bb;font-size:14px}
  input{width:100%;box-sizing:border-box;background:#0e1520;color:#e6edf7;border:1px solid #223047;border-radius:10px;padding:11px;font:inherit;margin:6px 0}
  button{width:100%;background:#6ee7b7;color:#04231a;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
  .key{background:#06281c;border:1px dashed #6ee7b7;padding:10px;border-radius:10px;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
  pre{white-space:pre-wrap;background:#0e1520;border:1px solid #223047;border-radius:10px;padding:10px;font-size:13px}
  .err{color:#f87171}.hide{display:none}
</style>
</head>
<body>
<div class="box">
  <h1>Get your free API key</h1>
  <p class="mut">Works like the OpenAI API. You get a daily token limit; it resets every day at 00:00 UTC.</p>
  <div id="form">
    <input id="name" placeholder="Your name" maxlength="60">
    <input id="email" placeholder="Email (optional)" maxlength="120">
    <button id="go">Create my key</button>
    <p id="err" class="err"></p>
  </div>
  <div id="done" class="hide">
    <p><b>Your key</b> (copy it now, it is shown only once):</p>
    <div class="key" id="key"></div>
    <button id="copy">Copy key</button>
    <p class="mut">Daily limit: <b id="quota"></b> tokens</p>
    <p class="mut">Use it like OpenAI:</p>
    <pre id="snip"></pre>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
$("#go").onclick = async () => {
  $("#err").textContent = "";
  const r = await fetch("/signup", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ name: $("#name").value.trim(), email: $("#email").value.trim() || undefined }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $("#err").textContent = (j.error && j.error.message) || "Something went wrong"; return; }
  $("#form").classList.add("hide"); $("#done").classList.remove("hide");
  $("#key").textContent = j.key; $("#quota").textContent = Number(j.quota_tokens_per_day).toLocaleString("en-IN");
  const base = location.origin + "/v1";
  $("#snip").textContent = `from openai import OpenAI\nclient = OpenAI(base_url="${base}", api_key="${j.key}")\nr = client.chat.completions.create(model="auto",\n    messages=[{"role":"user","content":"Hello"}])\nprint(r.choices[0].message.content)`;
};
$("#copy").onclick = () => navigator.clipboard.writeText($("#key").textContent).then(() => ($("#copy").textContent = "Copied ✓"));
</script>
</body>
</html>
